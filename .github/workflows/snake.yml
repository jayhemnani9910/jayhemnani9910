name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: jayhemnani9910
          outputs: |
            dist/github-snake.svg?color_snake=#B63C1A&color_dots=#F4F5F7,#EBEDF0,#D3D8DE,#D2703F,#B63C1A
            dist/github-snake-dark.svg?color_snake=#FF5C2B&color_dots=#0A0B0D,#171B21,#232A33,#B63C1A,#FF5C2B

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
